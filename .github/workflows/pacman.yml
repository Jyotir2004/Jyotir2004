name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pacman-contribution-graph
        run: npm install --global pacman-contribution-graph

      - name: Create output directory
        run: mkdir -p dist

      - name: Generate Dark Mode Pacman SVG
        run: pacman-contribution-graph --platform github --username Jyotir2004 --gameTheme github-dark --output dist/pacman-contribution-graph-dark.svg

      - name: Push SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
